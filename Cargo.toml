[workspace]
members = [
    "apps/native-backend",
    "crates/comando-ai",
    "crates/comando-diff",
    "crates/comando-git",
    "crates/comando-index",
    "crates/comando-fs",
    "crates/comando-persistence",
    "crates/comando-projects",
    "crates/comando-settings",
    "crates/comando-terminal",
    "crates/comando-types",
]
exclude = [
    "vendor/codex-acp",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
comando-types = { path = "crates/comando-types" }
comando-diff = { path = "crates/comando-diff" }
comando-settings = { path = "crates/comando-settings" }
agent-client-protocol = { version = "=1.2.0", features = ["unstable"] }
base64 = "0.22.1"
imara-diff = "0.2"
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "linux-native-async-persistent", "async-io", "crypto-rust"] }
notify = "8.2.0"
portable-pty = "0.9.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "process", "sync", "time"] }
tokio-util = { version = "0.7", features = ["compat"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
time = { version = "0.3.49", features = ["formatting"] }
url = "2.5.7"
uuid = { version = "1.23.3", features = ["v4"] }
walkdir = "2.5.0"
wasm-bindgen = "0.2.114"
