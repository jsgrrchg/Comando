name: Release

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    release-preflight:
        name: Release preflight
        runs-on: ubuntu-latest
        env:
            NODE_OPTIONS: --max-old-space-size=8192
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - uses: pnpm/action-setup@v4
              with:
                  version: 10.33.0

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - uses: dtolnay/rust-toolchain@stable

            - name: Validate release tag
              run: |
                  if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
                    echo "Release workflow must run from a tag, got $GITHUB_REF_TYPE: $GITHUB_REF_NAME" >&2
                    exit 1
                  fi

                  package_version="$(node -p "require('./package.json').version")"
                  expected_tag="v${package_version}"

                  if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
                    echo "Release tag $GITHUB_REF_NAME does not match package.json version $package_version (expected $expected_tag)." >&2
                    exit 1
                  fi

            - name: Build release notes
              run: |
                  node scripts/extract-changelog-release-notes.mjs "$GITHUB_REF_NAME" > release-notes.md
                  node scripts/build-release-body.mjs --version "$GITHUB_REF_NAME" --notes-file release-notes.md --output release-body.md

            - name: Upload release body
              uses: actions/upload-artifact@v4
              with:
                  name: release-body-${{ github.ref_name }}
                  path: release-body.md
                  if-no-files-found: error

            - name: Install Linux check toolchain
              run: |
                  sudo apt-get update
                  sudo apt-get install -y rpm libcrypt1

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build Claude ACP vendor
              run: |
                  npm ci --prefix vendor/Claude-agent-acp-upstream
                  npm run build --prefix vendor/Claude-agent-acp-upstream

            - name: Run release gate
              run: pnpm run check

    apt-repository-preflight:
        name: APT repository preflight
        needs: release-preflight
        runs-on: ubuntu-latest
        env:
            APT_REPO_GPG_PRIVATE_KEY: ${{ secrets.APT_REPO_GPG_PRIVATE_KEY }}
            APT_REPO_GPG_PASSPHRASE: ${{ secrets.APT_REPO_GPG_PASSPHRASE }}
            APT_REPO_GPG_KEY_ID: ${{ secrets.APT_REPO_GPG_KEY_ID }}
        steps:
            - name: Validate APT signing configuration
              run: |
                  missing=()
                  for name in APT_REPO_GPG_PRIVATE_KEY APT_REPO_GPG_PASSPHRASE APT_REPO_GPG_KEY_ID; do
                    if [[ -z "${!name:-}" ]]; then
                      missing+=("$name")
                    fi
                  done

                  if (( ${#missing[@]} > 0 )); then
                    printf 'Missing required APT repository secrets: %s\n' "${missing[*]}" >&2
                    exit 1
                  fi

                  export GNUPGHOME
                  GNUPGHOME="$(mktemp -d)"
                  chmod 700 "$GNUPGHOME"
                  printf '%s' "$APT_REPO_GPG_PRIVATE_KEY" | gpg --batch --import
                  gpg --batch --list-secret-keys "$APT_REPO_GPG_KEY_ID" >/dev/null

    dnf-repository-preflight:
        name: DNF repository preflight
        needs: release-preflight
        runs-on: ubuntu-latest
        env:
            APT_REPO_GPG_PRIVATE_KEY: ${{ secrets.APT_REPO_GPG_PRIVATE_KEY }}
            APT_REPO_GPG_PASSPHRASE: ${{ secrets.APT_REPO_GPG_PASSPHRASE }}
            APT_REPO_GPG_KEY_ID: ${{ secrets.APT_REPO_GPG_KEY_ID }}
        steps:
            - name: Validate DNF signing configuration
              run: |
                  missing=()
                  for name in APT_REPO_GPG_PRIVATE_KEY APT_REPO_GPG_PASSPHRASE APT_REPO_GPG_KEY_ID; do
                    if [[ -z "${!name:-}" ]]; then
                      missing+=("$name")
                    fi
                  done

                  if (( ${#missing[@]} > 0 )); then
                    printf 'Missing required DNF repository secrets: %s\n' "${missing[*]}" >&2
                    exit 1
                  fi

                  export GNUPGHOME
                  GNUPGHOME="$(mktemp -d)"
                  chmod 700 "$GNUPGHOME"
                  printf '%s' "$APT_REPO_GPG_PRIVATE_KEY" | gpg --batch --import
                  gpg --batch --list-secret-keys "$APT_REPO_GPG_KEY_ID" >/dev/null

    ensure-github-release:
        name: Ensure GitHub release
        needs: release-preflight
        runs-on: ubuntu-latest
        env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        steps:
            - name: Download release body
              uses: actions/download-artifact@v4
              with:
                  name: release-body-${{ github.ref_name }}
                  path: .release

            - name: Create or update release shell
              run: |
                  tag="$GITHUB_REF_NAME"
                  version="${tag#v}"
                  title="Comando v${version}"
                  notes_file=".release/release-body.md"

                  if gh release view "$tag" >/dev/null 2>&1; then
                    gh release edit "$tag" --title "$title" --notes-file "$notes_file"
                  else
                    gh release create "$tag" --title "$title" --notes-file "$notes_file" --verify-tag
                  fi

    release-macos:
        name: macOS universal
        needs: ensure-github-release
        runs-on: macos-latest
        env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
            APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY }}
            APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
            CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
            CSC_LINK: ${{ secrets.CSC_LINK }}
            NODE_OPTIONS: --max-old-space-size=8192
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - uses: pnpm/action-setup@v4
              with:
                  version: 10.33.0

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - name: Validate macOS release secrets
              run: |
                  required=(
                    APPLE_API_ISSUER
                    APPLE_API_KEY_P8
                    APPLE_API_KEY_ID
                    CSC_KEY_PASSWORD
                    CSC_LINK
                  )

                  missing=()
                  for name in "${required[@]}"; do
                    if [[ -z "${!name:-}" ]]; then
                      missing+=("$name")
                    fi
                  done

                  if (( ${#missing[@]} > 0 )); then
                    printf 'Missing required macOS release secrets: %s\n' "${missing[*]}" >&2
                    exit 1
                  fi

            - name: Materialize App Store Connect API key
              run: |
                  api_key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
                  printf '%s\n' "$APPLE_API_KEY_P8" > "$api_key_path"
                  chmod 600 "$api_key_path"

                  if ! grep -q 'BEGIN PRIVATE KEY' "$api_key_path"; then
                    echo 'APPLE_API_KEY does not look like a valid .p8 private key.' >&2
                    exit 1
                  fi

                  echo "APPLE_API_KEY=$api_key_path" >> "$GITHUB_ENV"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Prepare macOS AI runtime inputs
              run: |
                  npm ci --prefix vendor/Claude-agent-acp-upstream
                  npm run build --prefix vendor/Claude-agent-acp-upstream

                  rustup target add aarch64-apple-darwin x86_64-apple-darwin
                  export CARGO_TARGET_DIR="$PWD/resources/ai/embedded/codex-acp/target"
                  cargo build --manifest-path vendor/codex-acp/Cargo.toml --release --locked --target aarch64-apple-darwin
                  cargo build --manifest-path vendor/codex-acp/Cargo.toml --release --locked --target x86_64-apple-darwin

                  mkdir -p resources/ai/prebuilt/codex-acp/darwin-arm64
                  mkdir -p resources/ai/prebuilt/codex-acp/darwin-x64
                  cp "$CARGO_TARGET_DIR/aarch64-apple-darwin/release/codex-acp" resources/ai/prebuilt/codex-acp/darwin-arm64/codex-acp
                  cp "$CARGO_TARGET_DIR/x86_64-apple-darwin/release/codex-acp" resources/ai/prebuilt/codex-acp/darwin-x64/codex-acp
                  chmod +x resources/ai/prebuilt/codex-acp/darwin-arm64/codex-acp
                  chmod +x resources/ai/prebuilt/codex-acp/darwin-x64/codex-acp

                  node_version="$(node -p 'process.version')"
                  node_tmp="$RUNNER_TEMP/comando-node-prebuilt"
                  rm -rf "$node_tmp"
                  mkdir -p "$node_tmp"

                  for arch in arm64 x64; do
                    archive="node-${node_version}-darwin-${arch}.tar.gz"
                    curl -fsSL "https://nodejs.org/dist/${node_version}/${archive}" -o "$node_tmp/$archive"
                    tar -xzf "$node_tmp/$archive" -C "$node_tmp"
                    mkdir -p "resources/ai/prebuilt/node/darwin-${arch}/bin"
                    cp "$node_tmp/node-${node_version}-darwin-${arch}/bin/node" "resources/ai/prebuilt/node/darwin-${arch}/bin/node"
                    chmod +x "resources/ai/prebuilt/node/darwin-${arch}/bin/node"
                  done

            - name: Publish macOS artifacts
              run: pnpm run release:mac -- --config.forceCodeSigning=true

            - name: Upload macOS workflow artifacts
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: macos-universal-dist
                  path: build/macos-package/project/dist/*

    release-windows-x64:
        name: Windows x64
        needs: ensure-github-release
        runs-on: windows-latest
        env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            NODE_OPTIONS: --max-old-space-size=8192
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - uses: pnpm/action-setup@v4
              with:
                  version: 10.33.0

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - uses: dtolnay/rust-toolchain@stable

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build Windows x64 ACP payload
              run: pnpm run build:windows-acp:x64

            - name: Publish Windows x64 artifacts
              run: pnpm run release:win:x64

            - name: Upload Windows x64 workflow artifacts
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: windows-x64-dist
                  path: dist/*

    release-windows-arm64:
        name: Windows arm64
        needs: ensure-github-release
        runs-on: windows-11-arm
        env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            NODE_OPTIONS: --max-old-space-size=8192
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - uses: pnpm/action-setup@v4
              with:
                  version: 10.33.0

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - uses: dtolnay/rust-toolchain@stable

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build Windows arm64 ACP payload
              run: pnpm run build:windows-acp:arm64

            - name: Publish Windows arm64 artifacts
              run: pnpm run release:win:arm64

            - name: Upload Windows arm64 workflow artifacts
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: windows-arm64-dist
                  path: dist/*

    release-linux:
        name: Linux ${{ matrix.arch }}
        needs:
            - release-preflight
            - ensure-github-release
            - apt-repository-preflight
        runs-on: ${{ matrix.runner }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - arch: x64
                      runner: ubuntu-latest
                    - arch: arm64
                      runner: ubuntu-24.04-arm
        env:
            APT_REPO_GPG_PRIVATE_KEY: ${{ secrets.APT_REPO_GPG_PRIVATE_KEY }}
            APT_REPO_GPG_PASSPHRASE: ${{ secrets.APT_REPO_GPG_PASSPHRASE }}
            APT_REPO_GPG_KEY_ID: ${{ secrets.APT_REPO_GPG_KEY_ID }}
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            NODE_OPTIONS: --max-old-space-size=8192
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - uses: pnpm/action-setup@v4
              with:
                  version: 10.33.0

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - uses: dtolnay/rust-toolchain@stable

            - name: Install Linux package toolchain
              run: |
                  sudo apt-get update
                  sudo apt-get install -y gnupg rpm libcrypt1
                  command -v rpmsign

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build Claude ACP vendor
              run: |
                  npm ci --prefix vendor/Claude-agent-acp-upstream
                  npm run build --prefix vendor/Claude-agent-acp-upstream

            - name: Package Linux artifacts
              run: pnpm run package:linux

            - name: Sign Linux RPM package
              run: |
                  export GNUPGHOME
                  GNUPGHOME="$(mktemp -d)"
                  trap 'rm -rf "$GNUPGHOME"' EXIT
                  chmod 700 "$GNUPGHOME"
                  printf '%s' "$APT_REPO_GPG_PRIVATE_KEY" | gpg --batch --import
                  gpg --batch --list-secret-keys "$APT_REPO_GPG_KEY_ID" >/dev/null
                  gpg --batch --armor --export "$APT_REPO_GPG_KEY_ID" > "$RUNNER_TEMP/comando-rpm-signing-key.asc"
                  sudo rpm --import "$RUNNER_TEMP/comando-rpm-signing-key.asc"

                  node scripts/sign-rpm-packages.mjs \
                    --rpm-dir dist \
                    --key-id "$APT_REPO_GPG_KEY_ID"

            - name: Validate Linux RPM package
              run: |
                  node scripts/validate-linux-rpm-package.mjs \
                    --staged-assets-dir dist \
                    --arch "${{ matrix.arch }}" \
                    --version "${GITHUB_REF_NAME#v}" \
                    --require-signature

            - name: Upload Linux release assets
              run: |
                  shopt -s nullglob
                  linux_assets=(
                    dist/*.AppImage
                    dist/*.AppImage.blockmap
                    dist/*.deb
                    dist/*.rpm
                    dist/latest-linux*.yml
                  )

                  if (( ${#linux_assets[@]} == 0 )); then
                    echo "No Linux release assets found." >&2
                    exit 1
                  fi

                  gh release upload "$GITHUB_REF_NAME" "${linux_assets[@]}" --clobber

            - name: Upload Linux workflow artifacts
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: linux-${{ matrix.arch }}-dist
                  path: |
                      dist/*.AppImage
                      dist/*.AppImage.blockmap
                      dist/*.deb
                      dist/*.rpm
                      dist/latest-linux*.yml

    publish-release-notes:
        name: Publish release notes
        needs:
            - release-preflight
            - release-macos
            - release-windows-x64
            - release-windows-arm64
            - release-linux
            - publish-apt-repository
            - publish-dnf-repository
        runs-on: ubuntu-latest
        env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        steps:
            - name: Download release body
              uses: actions/download-artifact@v4
              with:
                  name: release-body-${{ github.ref_name }}
                  path: .release

            - name: Create or update GitHub release notes
              run: |
                  tag="$GITHUB_REF_NAME"
                  version="${tag#v}"
                  title="Comando v${version}"
                  notes_file=".release/release-body.md"

                  if gh release view "$tag" >/dev/null 2>&1; then
                    gh release edit "$tag" --title "$title" --notes-file "$notes_file"
                  else
                    gh release create "$tag" --title "$title" --notes-file "$notes_file" --verify-tag
                  fi

    publish-apt-repository:
        name: Publish APT repository
        needs:
            - release-preflight
            - release-macos
            - release-windows-x64
            - release-windows-arm64
            - release-linux
            - apt-repository-preflight
        runs-on: ubuntu-latest
        env:
            APT_REPO_GPG_PRIVATE_KEY: ${{ secrets.APT_REPO_GPG_PRIVATE_KEY }}
            APT_REPO_GPG_PASSPHRASE: ${{ secrets.APT_REPO_GPG_PASSPHRASE }}
            APT_REPO_GPG_KEY_ID: ${{ secrets.APT_REPO_GPG_KEY_ID }}
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - uses: actions/setup-node@v4
              with:
                  node-version: 22

            - name: Install APT repository toolchain
              run: |
                  sudo apt-get update
                  sudo apt-get install -y ca-certificates dpkg gnupg gzip

            - name: Download Linux workflow artifacts
              uses: actions/download-artifact@v4
              with:
                  pattern: linux-*-dist
                  path: .artifacts/linux
                  merge-multiple: true

            - name: Build APT repository metadata
              env:
                  APT_RELEASE_DIR: ${{ runner.temp }}/apt-release
              run: |
                  node scripts/build-apt-repository.mjs \
                    --layout flat-release \
                    --version "$GITHUB_REF_NAME" \
                    --release-assets-dir .artifacts/linux \
                    --output-dir "$APT_RELEASE_DIR" \
                    --repo-slug "$GITHUB_REPOSITORY" \
                    --suite stable \
                    --component main

            - name: Sign APT repository metadata
              env:
                  APT_RELEASE_DIR: ${{ runner.temp }}/apt-release
              run: |
                  export GNUPGHOME
                  GNUPGHOME="$(mktemp -d)"
                  chmod 700 "$GNUPGHOME"
                  printf '%s' "$APT_REPO_GPG_PRIVATE_KEY" | gpg --batch --import
                  gpg --batch --list-secret-keys "$APT_REPO_GPG_KEY_ID" >/dev/null

                  node scripts/sign-apt-repository.mjs \
                    --layout flat-release \
                    --apt-dir "$APT_RELEASE_DIR" \
                    --key-id "$APT_REPO_GPG_KEY_ID" \
                    --suite stable

            - name: Validate APT repository metadata
              env:
                  APT_RELEASE_DIR: ${{ runner.temp }}/apt-release
              run: |
                  export GNUPGHOME
                  GNUPGHOME="$(mktemp -d)"
                  chmod 700 "$GNUPGHOME"
                  gpg --batch --import "$APT_RELEASE_DIR/comando-archive-keyring.asc"

                  node scripts/validate-apt-repository.mjs \
                    --layout flat-release \
                    --apt-dir "$APT_RELEASE_DIR" \
                    --package-assets-dir .artifacts/linux \
                    --version "$GITHUB_REF_NAME" \
                    --suite stable \
                    --component main

            - name: Validate APT repository with apt
              env:
                  APT_RELEASE_DIR: ${{ runner.temp }}/apt-release
              run: |
                  APT_SMOKE_DIR="$RUNNER_TEMP/apt-smoke"
                  mkdir -p "$APT_SMOKE_DIR"
                  cp "$APT_RELEASE_DIR"/InRelease \
                    "$APT_RELEASE_DIR"/Release \
                    "$APT_RELEASE_DIR"/Release.gpg \
                    "$APT_RELEASE_DIR"/Packages \
                    "$APT_RELEASE_DIR"/Packages.gz \
                    "$APT_RELEASE_DIR"/comando-archive-keyring.asc \
                    "$APT_RELEASE_DIR"/comando.sources.example \
                    "$APT_SMOKE_DIR"/
                  find .artifacts/linux -type f -name '*.deb' -exec cp {} "$APT_SMOKE_DIR"/ \;

                  docker run --rm \
                    -e VERSION="${GITHUB_REF_NAME#v}" \
                    -v "$APT_SMOKE_DIR:/repo:ro" \
                    ubuntu:24.04 \
                    bash -lc '
                      set -euo pipefail
                      apt-get update
                      apt-get install -y ca-certificates gnupg
                      install -d -m 0755 /etc/apt/keyrings
                      cp /repo/comando-archive-keyring.asc /etc/apt/keyrings/comando.asc
                      chmod 0644 /etc/apt/keyrings/comando.asc
                      sed "s|^URIs: .*|URIs: file:///repo|" \
                        /repo/comando.sources.example \
                        >/etc/apt/sources.list.d/comando.sources
                      apt-get update
                      apt-cache policy comando
                      apt-cache policy comando | grep -F "$VERSION"
                      apt-get --print-uris install "comando=$VERSION"
                      apt-get install -y --download-only "comando=$VERSION"
                    '

            - name: Prepare gh-pages worktree
              env:
                  PAGES_DIR: ${{ runner.temp }}/gh-pages
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git fetch origin gh-pages || true

                  if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
                    git worktree add "$PAGES_DIR" refs/remotes/origin/gh-pages
                  else
                    git worktree add -B gh-pages "$PAGES_DIR" HEAD
                    git -C "$PAGES_DIR" rm -rf . || true
                    find "$PAGES_DIR" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
                  fi

                  git -C "$PAGES_DIR" config user.name "github-actions[bot]"
                  git -C "$PAGES_DIR" config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            - name: Ensure GitHub release exists
              run: |
                  tag="$GITHUB_REF_NAME"
                  version="${tag#v}"
                  title="Comando v${version}"

                  if gh release view "$tag" >/dev/null 2>&1; then
                    gh release edit "$tag" --title "$title"
                  else
                    gh release create "$tag" \
                      --title "$title" \
                      --notes "Release artifacts are still being finalized." \
                      --verify-tag
                  fi

            - name: Upload APT metadata to GitHub release
              env:
                  APT_RELEASE_DIR: ${{ runner.temp }}/apt-release
              run: |
                  gh release upload "$GITHUB_REF_NAME" \
                    "$APT_RELEASE_DIR/InRelease" \
                    "$APT_RELEASE_DIR/Release" \
                    "$APT_RELEASE_DIR/Release.gpg" \
                    "$APT_RELEASE_DIR/Packages" \
                    "$APT_RELEASE_DIR/Packages.gz" \
                    "$APT_RELEASE_DIR/comando-archive-keyring.asc" \
                    "$APT_RELEASE_DIR/comando.sources.example" \
                    --clobber

            - name: Validate published APT release endpoint
              env:
                  APT_RELEASE_DIR: ${{ runner.temp }}/apt-release
              run: |
                  docker run --rm \
                    -e REPO_SLUG="$GITHUB_REPOSITORY" \
                    -e RELEASE_TAG="$GITHUB_REF_NAME" \
                    -e VERSION="${GITHUB_REF_NAME#v}" \
                    -v "$APT_RELEASE_DIR:/repo:ro" \
                    ubuntu:24.04 \
                    bash -lc '
                      set -euo pipefail
                      apt-get update
                      apt-get install -y ca-certificates gnupg
                      install -d -m 0755 /etc/apt/keyrings
                      cp /repo/comando-archive-keyring.asc /etc/apt/keyrings/comando.asc
                      chmod 0644 /etc/apt/keyrings/comando.asc
                      sed "s|^URIs: .*|URIs: https://github.com/${REPO_SLUG}/releases/download/${RELEASE_TAG}|" \
                        /repo/comando.sources.example \
                        >/etc/apt/sources.list.d/comando.sources
                      apt-get update
                      apt-cache policy comando | grep -F "$VERSION"
                      apt-get --print-uris install "comando=$VERSION" | tee /tmp/comando-uris.txt
                      grep -F "https://github.com/${REPO_SLUG}/releases/download/${RELEASE_TAG}" /tmp/comando-uris.txt
                      grep -F "Comando-${VERSION}-linux-" /tmp/comando-uris.txt
                    '

            - name: Publish APT entrypoints to gh-pages
              env:
                  APT_RELEASE_DIR: ${{ runner.temp }}/apt-release
                  PAGES_DIR: ${{ runner.temp }}/gh-pages
              run: |
                  touch "$PAGES_DIR/.nojekyll"
                  mkdir -p "$PAGES_DIR/apt"
                  rm -rf "$PAGES_DIR/apt/dists" "$PAGES_DIR/apt/pool"
                  cp "$APT_RELEASE_DIR/comando-archive-keyring.asc" "$PAGES_DIR/apt/"
                  cp "$APT_RELEASE_DIR/comando.sources.example" "$PAGES_DIR/apt/"

                  package_asset="$(find "$PAGES_DIR/apt" -type f \( \
                    -name '*.deb' -o \
                    -name '*.rpm' -o \
                    -name '*.AppImage' -o \
                    -name '*.dmg' -o \
                    -name '*.exe' \
                  \) -print -quit)"

                  if [[ -n "$package_asset" ]]; then
                    echo "Package asset must stay on GitHub Releases, not gh-pages: $package_asset" >&2
                    exit 1
                  fi

                  find "$PAGES_DIR/apt" -maxdepth 2 -type f -print
                  test ! -d "$PAGES_DIR/apt/dists"
                  test ! -d "$PAGES_DIR/apt/pool"

                  git -C "$PAGES_DIR" add apt .nojekyll
                  if git -C "$PAGES_DIR" diff --cached --quiet; then
                    echo "No APT entrypoint changes to publish."
                  else
                    git -C "$PAGES_DIR" commit -m "Publish APT entrypoints for $GITHUB_REF_NAME"
                    git -C "$PAGES_DIR" push origin HEAD:gh-pages
                  fi

    publish-dnf-repository:
        name: Publish DNF repository
        needs:
            - release-preflight
            - ensure-github-release
            - release-linux
            - dnf-repository-preflight
            - publish-apt-repository
        runs-on: ubuntu-latest
        env:
            APT_REPO_GPG_PRIVATE_KEY: ${{ secrets.APT_REPO_GPG_PRIVATE_KEY }}
            APT_REPO_GPG_PASSPHRASE: ${{ secrets.APT_REPO_GPG_PASSPHRASE }}
            APT_REPO_GPG_KEY_ID: ${{ secrets.APT_REPO_GPG_KEY_ID }}
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - uses: actions/setup-node@v4
              with:
                  node-version: 22

            - name: Install DNF repository toolchain
              run: |
                  sudo apt-get update
                  sudo apt-get install -y createrepo-c gnupg gzip rpm

            - name: Download Linux workflow artifacts
              uses: actions/download-artifact@v4
              with:
                  pattern: linux-*-dist
                  path: .artifacts/linux
                  merge-multiple: true

            - name: Prepare gh-pages worktree
              env:
                  PAGES_DIR: ${{ runner.temp }}/gh-pages
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git fetch origin gh-pages || true

                  if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
                    git worktree add "$PAGES_DIR" refs/remotes/origin/gh-pages
                  else
                    git worktree add -B gh-pages "$PAGES_DIR" HEAD
                    git -C "$PAGES_DIR" rm -rf . || true
                    find "$PAGES_DIR" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
                  fi

                  git -C "$PAGES_DIR" config user.name "github-actions[bot]"
                  git -C "$PAGES_DIR" config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            - name: Build DNF repository metadata
              env:
                  PAGES_DIR: ${{ runner.temp }}/gh-pages
              run: |
                  node scripts/build-dnf-repository.mjs \
                    --version "$GITHUB_REF_NAME" \
                    --tag "$GITHUB_REF_NAME" \
                    --release-assets-dir .artifacts/linux \
                    --pages-dir "$PAGES_DIR" \
                    --repo-slug "$GITHUB_REPOSITORY"

            - name: Sign DNF repository metadata
              env:
                  PAGES_DIR: ${{ runner.temp }}/gh-pages
              run: |
                  export GNUPGHOME
                  GNUPGHOME="$(mktemp -d)"
                  chmod 700 "$GNUPGHOME"
                  printf '%s' "$APT_REPO_GPG_PRIVATE_KEY" | gpg --batch --import
                  gpg --batch --list-secret-keys "$APT_REPO_GPG_KEY_ID" >/dev/null

                  node scripts/sign-dnf-repository.mjs \
                    --dnf-dir "$PAGES_DIR/dnf" \
                    --key-id "$APT_REPO_GPG_KEY_ID"

            - name: Validate DNF repository metadata
              env:
                  PAGES_DIR: ${{ runner.temp }}/gh-pages
              run: |
                  export GNUPGHOME
                  GNUPGHOME="$(mktemp -d)"
                  chmod 700 "$GNUPGHOME"
                  gpg --batch --import "$PAGES_DIR/dnf/comando-archive-keyring.asc"

                  node scripts/validate-dnf-repository.mjs \
                    --dnf-dir "$PAGES_DIR/dnf" \
                    --version "$GITHUB_REF_NAME"

            - name: Validate DNF repository with Fedora
              env:
                  PAGES_DIR: ${{ runner.temp }}/gh-pages
              run: |
                  docker run --rm \
                    -e VERSION="${GITHUB_REF_NAME#v}" \
                    -v "$PAGES_DIR/dnf:/repo:ro" \
                    fedora:latest \
                    bash -lc '
                      set -euo pipefail
                      cp /repo/comando-archive-keyring.asc /etc/pki/rpm-gpg/comando-archive-keyring.asc
                      rpm --import /repo/comando-archive-keyring.asc
                      cp /repo/comando.repo.example /etc/yum.repos.d/comando.repo
                      sed -i "s|baseurl=.*|baseurl=file:///repo|" /etc/yum.repos.d/comando.repo
                      sed -i "s|gpgkey=.*|gpgkey=file:///repo/comando-archive-keyring.asc|" /etc/yum.repos.d/comando.repo
                      dnf -y makecache
                      dnf info comando
                      dnf info comando | grep -F "$VERSION"
                      dnf install -y --downloadonly comando
                    '

            - name: Publish DNF repository to gh-pages
              env:
                  PAGES_DIR: ${{ runner.temp }}/gh-pages
              run: |
                  touch "$PAGES_DIR/.nojekyll"

                  package_asset="$(find "$PAGES_DIR/apt" "$PAGES_DIR/dnf" -type f \( \
                    -name '*.deb' -o \
                    -name '*.rpm' -o \
                    -name '*.AppImage' -o \
                    -name '*.dmg' -o \
                    -name '*.exe' \
                  \) -print -quit 2>/dev/null)"

                  if [[ -n "$package_asset" ]]; then
                    echo "Package asset must stay on GitHub Releases, not gh-pages: $package_asset" >&2
                    exit 1
                  fi

                  find "$PAGES_DIR/dnf" -maxdepth 3 -type f -print
                  test -f "$PAGES_DIR/dnf/comando-archive-keyring.asc"
                  test -f "$PAGES_DIR/dnf/comando.repo.example"
                  test -f "$PAGES_DIR/dnf/repodata/repomd.xml"
                  test -f "$PAGES_DIR/dnf/repodata/repomd.xml.asc"

                  git -C "$PAGES_DIR" add dnf .nojekyll
                  if git -C "$PAGES_DIR" diff --cached --quiet; then
                    echo "No DNF repository changes to publish."
                  else
                    git -C "$PAGES_DIR" commit -m "Publish DNF repository for $GITHUB_REF_NAME"
                    git -C "$PAGES_DIR" push origin HEAD:gh-pages
                  fi
