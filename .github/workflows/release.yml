name: Release

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    release-macos:
        name: macOS universal
        runs-on: macos-latest
        env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
            APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY }}
            APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
            CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
            CSC_LINK: ${{ secrets.CSC_LINK }}
            NODE_OPTIONS: --max-old-space-size=8192
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - uses: pnpm/action-setup@v4
              with:
                  version: 10.33.0

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - name: Validate macOS release secrets
              run: |
                  required=(
                    APPLE_API_ISSUER
                    APPLE_API_KEY_P8
                    APPLE_API_KEY_ID
                    CSC_KEY_PASSWORD
                    CSC_LINK
                  )

                  missing=()
                  for name in "${required[@]}"; do
                    if [[ -z "${!name:-}" ]]; then
                      missing+=("$name")
                    fi
                  done

                  if (( ${#missing[@]} > 0 )); then
                    printf 'Missing required macOS release secrets: %s\n' "${missing[*]}" >&2
                    exit 1
                  fi

            - name: Materialize App Store Connect API key
              run: |
                  api_key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
                  printf '%s\n' "$APPLE_API_KEY_P8" > "$api_key_path"
                  chmod 600 "$api_key_path"

                  if ! grep -q 'BEGIN PRIVATE KEY' "$api_key_path"; then
                    echo 'APPLE_API_KEY does not look like a valid .p8 private key.' >&2
                    exit 1
                  fi

                  echo "APPLE_API_KEY=$api_key_path" >> "$GITHUB_ENV"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Prepare macOS AI runtime inputs
              run: |
                  npm ci --prefix vendor/Claude-agent-acp-upstream
                  npm run build --prefix vendor/Claude-agent-acp-upstream

                  rustup target add aarch64-apple-darwin x86_64-apple-darwin
                  export CARGO_TARGET_DIR="$PWD/resources/ai/embedded/codex-acp/target"
                  cargo build --manifest-path vendor/codex-acp/Cargo.toml --release --locked --target aarch64-apple-darwin
                  cargo build --manifest-path vendor/codex-acp/Cargo.toml --release --locked --target x86_64-apple-darwin

                  mkdir -p resources/ai/prebuilt/codex-acp/darwin-arm64
                  mkdir -p resources/ai/prebuilt/codex-acp/darwin-x64
                  cp "$CARGO_TARGET_DIR/aarch64-apple-darwin/release/codex-acp" resources/ai/prebuilt/codex-acp/darwin-arm64/codex-acp
                  cp "$CARGO_TARGET_DIR/x86_64-apple-darwin/release/codex-acp" resources/ai/prebuilt/codex-acp/darwin-x64/codex-acp
                  chmod +x resources/ai/prebuilt/codex-acp/darwin-arm64/codex-acp
                  chmod +x resources/ai/prebuilt/codex-acp/darwin-x64/codex-acp

                  node_version="$(node -p 'process.version')"
                  node_tmp="$RUNNER_TEMP/comando-node-prebuilt"
                  rm -rf "$node_tmp"
                  mkdir -p "$node_tmp"

                  for arch in arm64 x64; do
                    archive="node-${node_version}-darwin-${arch}.tar.gz"
                    curl -fsSL "https://nodejs.org/dist/${node_version}/${archive}" -o "$node_tmp/$archive"
                    tar -xzf "$node_tmp/$archive" -C "$node_tmp"
                    mkdir -p "resources/ai/prebuilt/node/darwin-${arch}/bin"
                    cp "$node_tmp/node-${node_version}-darwin-${arch}/bin/node" "resources/ai/prebuilt/node/darwin-${arch}/bin/node"
                    chmod +x "resources/ai/prebuilt/node/darwin-${arch}/bin/node"
                  done

            - name: Publish macOS artifacts
              run: pnpm run release:mac -- --config.forceCodeSigning=true

            - name: Upload macOS workflow artifacts
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: macos-universal-dist
                  path: build/macos-package/project/dist/*

    release-windows-x64:
        name: Windows x64
        runs-on: windows-latest
        env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            NODE_OPTIONS: --max-old-space-size=8192
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - uses: pnpm/action-setup@v4
              with:
                  version: 10.33.0

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - uses: dtolnay/rust-toolchain@stable

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Publish Windows x64 artifacts
              run: pnpm run release:win:x64

            - name: Upload Windows x64 workflow artifacts
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: windows-x64-dist
                  path: dist/*

    release-windows-arm64:
        name: Windows arm64
        runs-on: windows-11-arm
        env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            NODE_OPTIONS: --max-old-space-size=8192
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - uses: pnpm/action-setup@v4
              with:
                  version: 10.33.0

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - uses: dtolnay/rust-toolchain@stable

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Publish Windows arm64 artifacts
              run: pnpm run release:win:arm64

            - name: Upload Windows arm64 workflow artifacts
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: windows-arm64-dist
                  path: dist/*

    release-linux:
        name: Linux ${{ matrix.arch }}
        runs-on: ${{ matrix.runner }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - arch: x64
                      runner: ubuntu-latest
                    - arch: arm64
                      runner: ubuntu-24.04-arm
        env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            NODE_OPTIONS: --max-old-space-size=8192
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - uses: pnpm/action-setup@v4
              with:
                  version: 10.33.0

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - uses: dtolnay/rust-toolchain@stable

            - name: Install Linux package toolchain
              run: |
                  sudo apt-get update
                  sudo apt-get install -y rpm libcrypt1

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build Claude ACP vendor
              run: |
                  npm ci --prefix vendor/Claude-agent-acp-upstream
                  npm run build --prefix vendor/Claude-agent-acp-upstream

            - name: Publish Linux artifacts
              run: pnpm run release:linux

            - name: Upload Linux workflow artifacts
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: linux-${{ matrix.arch }}-dist
                  path: |
                      dist/*.AppImage
                      dist/*.deb
                      dist/*.rpm
                      dist/latest-linux*.yml
